# Refreshes every reporter's data from the live Eurostat API and
# redeploys the site, on a schedule -- this is the "always fetch new
# data" piece of the project, running unattended once this repo is on
# GitHub (see docs/llm_agent_handoff.md for the local-only alternative
# this replaces, and for why a plain Windows Task Scheduler entry on one
# person's PC isn't enough for a *hosted* site).
#
# Nothing here commits the refreshed data back into git history -- every
# run re-fetches everything from scratch (cheap enough: a few hundred
# small API calls, a couple of minutes) and publishes straight to GitHub
# Pages via the official deploy action, so the repo stays source code
# only, not a growing pile of regenerated CSVs.
name: Refresh data and deploy

on:
  schedule:
    # 03:11 UTC on the 1st and 15th of each month -- roughly every two
    # weeks (14-17 days apart depending on the month, not exactly 14,
    # since cron has no native "every N weeks" field). Chosen over a
    # once-a-week-skip-every-other-week workaround since this needs no
    # extra logic in the job itself -- just two fixed dates. The minute
    # (:11, not :00) is a real GitHub Actions recommendation, not
    # superstition: jobs scheduled for the exact top of the hour queue up
    # behind thousands of other repos' cron jobs and can run late.
    - cron: '11 3 1,15 * *'
  # Lets you (or a future agent) trigger a refresh on demand from the
  # GitHub UI/API, e.g. right after fixing a bug, instead of waiting for
  # the next scheduled run.
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - run: pip install -r requirements.txt

      - name: Refresh data and rebuild every page
        run: python scripts/refresh_all.py
        working-directory: .

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
